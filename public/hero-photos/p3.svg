<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD9C2"/>
      <stop offset="0.5" stop-color="#FFAFA0"/>
      <stop offset="1" stop-color="#D9532E"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#sky3)"/>
  <!-- sol grande poniente -->
  <circle cx="300" cy="520" r="180" fill="#FFE99B" opacity="0.85"/>
  <circle cx="300" cy="520" r="120" fill="#FFC57A"/>
  <!-- mar / silueta -->
