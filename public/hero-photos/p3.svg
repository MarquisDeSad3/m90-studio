    <circle cx="245" cy="555" r="13"/>
    <ellipse cx="320" cy="620" rx="16" ry="45"/>
    <circle cx="320" cy="568" r="11"/>
    <!-- línea brazo unido -->
    <rect x="265" y="595" width="40" height="3"/>
  </g>
  <!-- pajaritos -->
  <g fill="#0a0d1a" opacity="0.7">
    <path d="M 100 220 Q 110 210 120 220 Q 130 210 140 220" fill="none" stroke="#0a0d1a" stroke-width="2"/>
    <path d="M 420 180 Q 430 170 440 180 Q 450 170 460 180" fill="none" stroke="#0a0d1a" stroke-width="2"/>
    <path d="M 480 280 Q 488 274 496 280 Q 504 274 512 280" fill="none" stroke="#0a0d1a" stroke-width="2"/>
  </g>
</svg>
